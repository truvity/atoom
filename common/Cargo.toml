[package]
name = "atoom-common"
description = "Types every atoom port and driver speaks: the Refusal and IndexEntry messages (buffa) and the helpers that build and read a Refusal detail of a Connect error."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
# The generated code carries examples from the proto comments; they are not tests of ours.
doctest = false

[dependencies]
# The Connect error-detail value is base64 (unpadded standard alphabet; padding accepted on read): the helper reads it. The same
# version as connectrpc's own, so the build holds one copy.
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# The generated messages derive serde for the JSON form (the buffa `json` feature).
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "=0.9.0"
