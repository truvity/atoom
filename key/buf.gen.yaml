version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/truvity/atoom/key/gen
plugins:
  # protoc-gen-go comes from devbox.
  - local: protoc-gen-go
    out: key/gen
    opt: paths=source_relative
  # protoc-gen-connect-go runs as a Go tool (tools/go.mod), so its version is the one that go.mod pins: the ConnectRPC runtime's.
  - local: [go, tool, protoc-gen-connect-go]
    out: key/gen
    opt: paths=source_relative
