[package]
name = "atoom-destination"
description = "The destination port: the ConnectRPC contract (atoom.destination.v1alpha1.DestinationService) for where a published document is written, listed, removed, purged at the edge and read back, as buffa messages and a generated client and service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
# The generated code carries examples from the proto comments; they are not tests of ours.
doctest = false

[dependencies]
atoom-common = { path = "../common" }
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# The generated messages derive serde for the JSON form (the buffa `json` feature).
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "=0.9.0"
