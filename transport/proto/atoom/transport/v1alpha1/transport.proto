// The transport port: a durable queue that carries opaque messages from emitters to one consumer, in order and at least once. What a
// message's payload holds is the consumer's; the transport never looks inside it.
syntax = "proto3";

package atoom.transport.v1alpha1;

// TransportService carries messages from emitters to one consumer.
service TransportService {
  rpc Emit(EmitRequest) returns (EmitResponse);                    // emitters; caller known by peer uid
  rpc Receive(ReceiveRequest) returns (stream ReceiveResponse);    // the consumer only
  rpc Ack(AckRequest) returns (AckResponse);                       // the consumer only
}

// Message is one message: its unique id and its payload. The field numbers are those of the message before it was made generic, so
// the bytes of a message kept by a driver (a spool's segment, a stream, a queue) read the same.
message Message {
  string id = 1;        // the message's unique id: the key of at-least-once delivery and of a broker's deduplication
  bytes payload = 2;    // the consumer's bytes, opaque to the transport; at least one
  reserved 3;
  reserved "usage";
}

// EmitRequest hands a message to the transport.
message EmitRequest {
  Message message = 1;       // the message
  bool blocking = 2;         // answer only once fsync'd
}

// EmitResponse says the transport has the message.
message EmitResponse {}

// ReceiveRequest opens the stream of deliveries.
message ReceiveRequest {
  uint32 max_batch = 1;  // the most deliveries in one response
}

// Delivery is one message handed to the consumer.
message Delivery {
  uint64 delivery_id = 1;     // what the consumer acknowledges
  string emitter = 2;         // who the driver took the caller of the emit to be: the socket's peer or the host's naming, never a field of the message
  Message message = 3;        // the message
}

// ReceiveResponse is a batch of deliveries.
message ReceiveResponse {
  repeated Delivery deliveries = 1;  // the batch
}

// AckRequest acknowledges deliveries once the consumer is done with them.
message AckRequest {
  repeated uint64 delivery_ids = 1;  // the deliveries done
}

// AckResponse says the acknowledgement is recorded.
message AckResponse {}
