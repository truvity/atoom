[package]
name = "atoom-transport-conformance"
description = "The conformance kit of the transport port: the suite every transport driver must pass, run through the driver's ConnectRPC endpoints (library and the binary transport-conformance)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "atoom_transport_conformance"

[[bin]]
name = "transport-conformance"
path = "src/main.rs"

[dependencies]
anyhow = "1"
atoom-transport = { path = ".." }
atoom-common = { path = "../../common" }
atoom-socket = { path = "../../socket" }
clap = { version = "4", features = ["derive"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
futures = "0.3"
