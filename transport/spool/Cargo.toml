[package]
name = "atoom-transport-spool"
description = "The spool driver of the transport port: the transport contract over a local, fsync'd, bounded queue of segment files. A library (the two ConnectRPC handlers, Emit and Consume) and the thin main transport-spool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# The command-line flags and the sockets of the thin main (clap, atoom-socket): what transport-spool needs and a library consumer does
# not. A consumer that mounts the routers in a host of its own turns the default features off.
default = ["cli"]
cli = ["dep:clap", "dep:atoom-socket", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]

[lib]
name = "atoom_transport_spool"

[[bin]]
name = "transport-spool"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
atoom-common = { path = "../../common" }
atoom-socket = { path = "../../socket", optional = true }
atoom-transport = { path = ".." }
aws-lc-rs = "1"
buffa = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"], optional = true }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
futures = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
# The backend suite (`suite::run_temp`) makes a temporary directory.
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
atoom-socket = { path = "../../socket" }
atoom-transport-conformance = { path = "../conformance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
