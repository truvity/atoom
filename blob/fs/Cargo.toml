[package]
name = "atoom-blob-fs"
description = "The fs driver of the blob port: the blob contract over a local directory, with a write-once create and a conditional put of a pointer (Linux only). A library (the ConnectRPC handler) and the thin main blob-fs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.atoom]
# The operating systems this library builds and runs on. The recipes that build and test the whole workspace leave a library out on
# any other system (`just rust-skip`), and its README says so.
os = ["linux"]

[features]
# The command-line flags and the socket of the thin main (clap, atoom-socket): what blob-fs needs and a library consumer does not.
# A consumer that mounts the router in a host of its own turns the default features off.
default = ["cli"]
cli = ["dep:clap", "dep:atoom-socket", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]

[lib]
name = "atoom_blob_fs"

[[bin]]
name = "blob-fs"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
atoom-blob-fsdir = { path = "../fsdir" }
atoom-socket = { path = "../../socket", optional = true }
clap = { version = "4", features = ["derive", "string"], optional = true }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
# The backend suite (`suite::run_temp`) makes a temporary directory.
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
atoom-blob = { path = ".." }
atoom-blob-conformance = { path = "../conformance" }
atoom-common = { path = "../../common" }
atoom-socket = { path = "../../socket" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
