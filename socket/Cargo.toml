[package]
name = "atoom-socket"
description = "Connect over a UNIX socket: dial a socket and serve a router on one, with a caller guard (the peer uid, from the kernel, must be in an allowed set), the socket group and mode, and the peer handed to the handlers. The host plumbing of atoom's thin mains, kits and tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# The flags of the guard for a thin main (`--allow-uid`, `--allow-any-uid`, `--socket-gid`, `--socket-mode`) and its `version` command:
# what a command line needs and a library consumer does not.
cli = ["dep:clap"]
# `testing::Recorder`: a server that records the deadline and the correlation id each call carried, for the tests of a port's client.
testing = ["dep:http-body-util"]

[dependencies]
anyhow = "1"
atoom-common = { path = "../common" }
bytes = "1"
clap = { version = "4", features = ["derive", "string"], optional = true }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
futures = "0.3"
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "http1", "http2"] }
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
