[package]
name = "atoom-source-credential"
description = "The credential driver of the source port: the secret source contract over systemd credentials, or a directory of them (Linux only). A library (the ConnectRPC handler) and the thin main source-credential."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.atoom]
# The operating systems this library builds and runs on. The recipes that build and test the whole workspace leave a library out on
# any other system (`just rust-skip`), and its README says so.
os = ["linux"]

[features]
# The command-line flags and the socket of the thin main (clap, atoom-socket): what source-credential needs and a library consumer does not.
# A consumer that mounts the router in a host of its own turns the default features off.
default = ["cli"]
cli = ["dep:clap", "dep:atoom-socket", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal"]

[lib]
name = "atoom_source_credential"

[[bin]]
name = "source-credential"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
atoom-common = { path = "../../common" }
atoom-socket = { path = "../../socket", optional = true }
atoom-source = { path = ".." }
clap = { version = "4", features = ["derive", "string"], optional = true }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
rustix = { version = "1", features = ["fs", "process"] }
# The backend suite (`suite::run_temp`) makes a temporary directory.
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
atoom-socket = { path = "../../socket" }
atoom-source-conformance = { path = "../conformance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
