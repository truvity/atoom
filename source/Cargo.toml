[package]
name = "atoom-source"
description = "The source port: the ConnectRPC contract (atoom.source.v1alpha1.SourceService) for reading the bytes of a named value, a signed configuration document or a secret, with a label that tells when they changed, as buffa messages and a generated client and service."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
# The generated code carries examples from the proto comments; they are not tests of ours.
doctest = false

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
# The generated messages derive serde for the JSON form (the buffa `json` feature).
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "=0.9.0"
