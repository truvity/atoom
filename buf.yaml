version: v2
# One module per port, listed explicitly (docs/archive/extraction-plan.md, section 5): a port's contract is <port>/proto/atoom/<port>/v1alpha1/*.proto.
# The generated code of a port is committed next to it (<port>/gen), made by <port>/buf.gen.yaml (`just gen`).
modules:
  - path: blob/proto
  - path: blocks/seal/proto
  - path: blocks/token/proto
  - path: common/proto
  - path: destination/proto
  - path: index/proto
  - path: source/proto
  - path: store/proto
  - path: key/proto
  - path: transport/proto
lint:
  use:
    - STANDARD
  ignore_only:
    # The item contract names its messages after the contract (ItemGetRequest, ItemGetResponse), as it did in sluis; a rename would
    # change every consumer's spelling for no change on the wire.
    RPC_REQUEST_STANDARD_NAME:
      # The blob contract's reads are BlobGetRequest and BlobListRequest, as they were in sluis (Create and Put are plain).
      - blob/proto/atoom/blob/v1alpha1/blob.proto
      - store/proto/atoom/store/v1alpha1/item.proto
      # The source contract's watch request and response are SourceWatchRequest and SourceWatchResponse, as they were in sluis.
      - source/proto/atoom/source/v1alpha1/source.proto
    RPC_RESPONSE_STANDARD_NAME:
      - blob/proto/atoom/blob/v1alpha1/blob.proto
      - store/proto/atoom/store/v1alpha1/item.proto
      - source/proto/atoom/source/v1alpha1/source.proto
    # The values of the source contract's Watch enum are NONE, NOTIFY and POLL, as they were in sluis; a prefix would rename them in
    # every consumer's code for no change on the wire.
    ENUM_VALUE_PREFIX:
      - source/proto/atoom/source/v1alpha1/source.proto
# `just proto-breaking` compares with the last release; while the contracts are v1alpha1 they may break, and the PR carries the
# `breaking:<library>` label (docs/archive/extraction-plan.md, section 8).
breaking:
  use:
    - FILE
  # The breaks of step B12 (record 0025), allowed by record 0015 while the contracts are v1alpha1 and carried by the breaking:<library>
  # labels. They are compared with the last release, so each stays listed until 0.9.0 is released; the release's pull request removes them.
  ignore:
    - transport/proto/atoom/transport/v1alpha1/transport.proto
    - index/proto/atoom/index/v1alpha1/index.proto
