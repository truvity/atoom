# The release candidate of the drivers (docs/release.md, "The candidate"; docs/packages.md). A release is published from the bytes of a
# candidate: the files that this workflow built once (every driver as a tarball and as a .deb and an .rpm package, with SBOMs and sums),
# installed on Ubuntu 24.04, Rocky Linux 10 and Amazon Linux 2023 and run as an image, on an amd64 and an arm64 hosted runner, and named
# by digest in a report of that smoke (evidence.json). The tag run (release.yaml) builds nothing: it takes these artifacts, holds every
# file it will publish to the digests of the report and to the table of the drivers, and publishes them. So the bytes that were smoked are
# the bytes that ship, and a failure of the smoke costs no version number: nothing is tagged until this workflow has passed on the commit.
# The images are the one thing the tag run makes: it puts the executables of the tarballs, byte for byte, into the images and pushes them.
#
# When it runs. On a push to master that changes the first heading of CHANGELOG.md to a release version with no tag (the pull request that
# `just release-prepare` makes; tools/release/candidate-scope.sh decides), with the version of that heading. And as a rehearsal: ci.yaml
# calls it (workflow_call, rehearsal: true) on every pull request, merge group and push to master that can affect the packaging or the release
# machinery, with the version 0.0.0 that no release is, so that the whole path (the builds on both architectures, the packages, the smoke, the
# evidence and the mutants of its gate) runs before a candidate has to. A rehearsal keeps its artifacts for a day, a candidate for 30: the
# owner tags a candidate days later, and an expired candidate is built again by a new commit that changes the first heading of CHANGELOG.md.
#
# Safety. Every job holds `contents: read` and nothing else, no id-token, and no job passes a token to a step that runs the code of a
# dependency; it runs on GitHub-hosted runners only. The evidence is a defect gate and not a supply-chain control (tools/release/evidence.sh).
# Nothing is pushed and nothing is signed here.
name: Candidate

on:
  push:
    branches: [master]
    paths: [CHANGELOG.md]
  workflow_call:
    inputs:
      rehearsal:
        description: Rehearse the candidate (the version 0.0.0, short-lived artifacts) instead of building the one that the CHANGELOG names
        type: boolean
        default: false

permissions: {}

# A pull request's rehearsal cancels the one it supersedes; a push to master never cancels, and shares no group with another commit's. The
# workflow's name is in the group because, called by ci.yaml, this workflow runs on the same commit as its own push run, and the two must
# not queue behind each other.
concurrency:
  group: candidate-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope (a release candidate or a rehearsal, and its version)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      version: ${{ steps.scope.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags (a candidate's version has no tag) and the history (what a push or a pull request changes).
          fetch-depth: 0
          persist-credentials: false
      - name: Is this a candidate, or a rehearsal that is needed, and which version
        id: scope
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" != true ]; then
            # A push to master: a candidate when the heading of CHANGELOG.md became an untagged release version.
            tools/release/candidate-scope.sh "$BEFORE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # What changed: against the base of a pull request or a merge group, or the commit before a push. With nothing to compare with (the
          # first push, a base that is not in the clone) the rehearsal runs.
          base=${BASE:-$BEFORE}
          run=true
          if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            run=
            changed=$(git diff --no-renames --name-only "$base" HEAD)
            while IFS= read -r f; do
              case "$f" in
                Justfile | devbox.json | devbox.lock | rust-toolchain.toml | Cargo.toml | Cargo.lock | go.work | go.work.sum | versions.yaml) run=true ;;
                */Cargo.toml | */go.mod | */go.sum | .cargo/*) run=true ;;
                # The thin mains and what they link: every executable is a release artifact.
                */cmd/* | */src/main.rs | */src/bin/*) run=true ;;
                deploy/release/* | tools/release/*) run=true ;;
                docs/packages.md | docs/socket-guard.md | LICENSE) run=true ;;
                .github/workflows/ci.yaml | .github/workflows/candidate.yaml | .github/workflows/release.yaml) run=true ;;
              esac
            done <<<"$changed"
            run=${run:-false}
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "the candidate is rehearsed: $run"
          if [ "$run" = true ]; then
            echo "version=0.0.0" >>"$GITHUB_OUTPUT"
          fi

  # Every executable that is built anywhere, for both architectures: Go with CGO off and Rust through zig, static (tools/release/build.sh).
  # No token: the build runs the build scripts and macros of every dependency.
  build:
    name: build (the portable executables, both architectures, no credentials)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      # A candidate is prepared by `just release-prepare`: the tree says the version it is built as.
      - name: The tree is prepared for this version
        if: ${{ !inputs.rehearsal }}
        run: devbox run -- tools/release/check-tree.sh "$VERSION"
      - run: devbox run -- just rust-toolchain
      # A candidate builds from the sources and the locked dependencies alone, as a release does: no cache is restored. A rehearsal restores
      # one, to be quick, and its bytes are never published.
      - if: ${{ inputs.rehearsal }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            target/
          key: release-${{ runner.os }}-${{ hashFiles('go.work.sum', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-${{ runner.os }}-
      - run: devbox run -- just release-build "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-portable
          # A re-run of this job (gh run rerun --failed) uploads again; this job is the only one that writes the name.
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.rehearsal && 1 || 30 }}
          # The root of the artifact is dist/bin: linux_amd64/, linux_arm64/, darwin_amd64/, darwin_arm64/.
          path: dist/bin

  # The driver that links libpcsclite is never cross-compiled: it is built on a runner of each architecture, in an Ubuntu 22.04 userland
  # (tools/release/native.sh), so no QEMU is needed. No token.
  native:
    name: 'native (${{ matrix.arch }}: the card driver, cgo over libpcsclite, no credentials)'
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/release/native.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-native-${{ matrix.arch }}
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.rehearsal && 1 || 30 }}
          path: dist/bin

  # The tarballs, the packages, the SBOMs and the sums, from the executables of the two jobs above, held to the table of the drivers.
  assemble:
    name: assemble (tarballs, .deb and .rpm packages, SBOMs, sums)
    needs: [scope, build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/bin
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - run: devbox run -- just release-assemble "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.rehearsal && 1 || 30 }}
          path: dist/release

  # The smoke (tools/release/smoke.sh, tools/release/images.sh smoke): the packages installed from their files on three systems and run, and
  # every image built from the same executables and run, on a runner of each architecture. The runner runs the files of the previous job.
  smoke:
    name: 'smoke (${{ matrix.arch }}: Ubuntu 24.04, Rocky Linux 10, Amazon Linux 2023, the images)'
    needs: [scope, assemble]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.scope.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - name: The files are exactly the release
        run: tools/release/check-dist.sh dist/release "$VERSION"
      - name: The packages on three systems
        env:
          ATOOM_ARCHES: ${{ matrix.arch }}
        run: tools/release/smoke.sh "$VERSION"
      - name: The images
        env:
          ATOOM_ARCHES: ${{ matrix.arch }}
        run: tools/release/images.sh smoke "$VERSION"
      - name: The record of this smoke
        run: tools/release/evidence.sh record "${{ matrix.arch }}" "$VERSION" "$GITHUB_SHA" "smoke-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name for each architecture and attempt of the run: a re-run of the failed smoke job (gh run rerun --failed) uploads under a
          # new name, and the job candidate takes the newest attempt of each architecture.
          name: smoke-${{ matrix.arch }}-${{ github.run_attempt }}
          path: smoke-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: ${{ inputs.rehearsal && 1 || 30 }}

  # Joins the records of the two architectures into the evidence of the candidate, with the digest of every file of the release, and holds
  # the files to it with the gate of the tag run. Then the gate is shown to bite on these very bytes: a changed byte, a file added, a file
  # taken away, another commit, a rehearsal's evidence, a missing architecture and a driver left out must each be refused. It runs the
  # scripts of this tree, from the checkout: the evidence is not written by a binary that the build jobs made. It also rehearses the push of the
  # images on a registry that it throws away.
  candidate:
    name: candidate (join the evidence, hold the files to it, break them)
    needs: [scope, assemble, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.scope.outputs.version }}
      ATTEMPT: ${{ github.run_attempt }}
      REHEARSAL: ${{ inputs.rehearsal && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          path: dist/smoke
      # The tree is a trust anchor of the check (the table of the drivers): nothing that a download did may have changed a tracked file (dist/
      # is ignored by git).
      - name: The tree is as the commit has it
        run: git diff --quiet HEAD
      - name: Join the evidence of the architectures
        run: |
          set -euo pipefail
          mkdir -p dist/candidate
          # The newest attempt of each architecture.
          records=()
          for arch in amd64 arm64; do
            f=$(find dist/smoke -path "*/smoke-$arch-*/smoke-$arch.json" | sort -t- -k3 -n | tail -n 1)
            [ -n "$f" ] || { echo "no smoke record of $arch" >&2; exit 1; }
            records+=("$f")
          done
          tools/release/evidence.sh merge dist/release "$VERSION" "$GITHUB_SHA" "$REHEARSAL" "${records[@]}" >dist/candidate/evidence.json
      - name: Hold the files to the evidence, as the tag run does
        run: |
          set -euo pipefail
          tools/release/check-dist.sh dist/release "$VERSION"
          tools/release/candidate-mutants.sh dist/release dist/candidate/evidence.json "$VERSION" "$GITHUB_SHA"
      # The tag run pushes the images to ghcr.io for the first time on a real release: the same script pushes them here to a registry that
      # this step starts and throws away (a multi-architecture manifest with a provenance attestation, pulled with no credential, kept by a
      # second push, an SBOM for each).
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - name: The push of the images, rehearsed on a throw-away registry
        run: devbox run -- just release-images-rehearsal "$VERSION"
      - name: Summary
        run: |
          {
            echo "### Release candidate $VERSION"
            echo
            echo "Commit \`$GITHUB_SHA\`$([ "$REHEARSAL" = true ] && echo ', a rehearsal: it is not published.' || echo '.')"
            echo "Evidence: $(jq '.files | length' dist/candidate/evidence.json) files by digest, smoke on $(jq -r '.smoke | keys | join(" and ")' dist/candidate/evidence.json): $(jq -r '.smoke.amd64.drivers | length' dist/candidate/evidence.json) drivers on $(jq -r '.smoke.amd64.systems | join(", ")' dist/candidate/evidence.json), and the images."
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          overwrite: true
          if-no-files-found: error
          retention-days: ${{ inputs.rehearsal && 1 || 30 }}
          path: dist/candidate/evidence.json
