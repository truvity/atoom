// The contract of the token block (docs/token-block.md, record 0020): compact JWS (RFC 7515) of a host's claims, signed by purpose through
// the seal block, the published key set (RFC 7517) with a kid rule per purpose, and the verification of a token against it. The block is
// stateless: its key set holds the current key of each purpose and the public keys its host hands in (a previous key, a next key). The
// rotation ring that decides those keys is step B8b, and the claims rules stay each host's.
syntax = "proto3";

package atoom.token.v1alpha1;

// TokenService is served by the token block. It holds no key: every signature is the seal block's, and so the key port's.
service TokenService {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);  // the purposes the host declared
  rpc Sign(SignRequest) returns (SignResponse);                          // a compact JWS of the host's claims, by the key of a purpose
  rpc KeySet(KeySetRequest) returns (KeySetResponse);                    // the JWK Set: the current keys of purposes and the host's keys
  rpc Verify(VerifyRequest) returns (VerifyResponse);                    // the signature of a compact JWS, against the same keys
  rpc Ring(RingRequest) returns (RingResponse);                          // the rings of ring purposes, as they are: nothing is written
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);           // applies the ring's rules now, for a host's loop
  rpc Revoke(RevokeRequest) returns (RevokeResponse);                    // a kid of a ring purpose is revoked, at once and for good
  rpc ConfirmPublished(ConfirmPublishedRequest) returns (ConfirmPublishedResponse); // the host: every published copy has these kids
}

// Kid is how the kid of a purpose's key is made.
enum Kid {
  KID_UNSPECIFIED = 0;  // not set
  KID_KEY_ID = 1;       // the key port's key_id, as it is (record 0016; session's rule)
  KID_THUMBPRINT = 2;   // the RFC 7638 thumbprint of the key, base64url without padding (sluis's rule)
}

// CapabilitiesRequest asks what the block serves.
message CapabilitiesRequest {}

// CapabilitiesResponse says what the block serves.
message CapabilitiesResponse {
  repeated PurposeInfo purposes = 1;  // the purposes the host declared: the only names the other calls accept
}

// PurposeInfo is one purpose of the host's declaration, as the block serves it.
message PurposeInfo {
  string name = 1;            // the purpose: a USE_SIGN purpose of the seal block
  string algorithm = 2;       // its algorithm, from the seal block: "ES384", "ES256" or "RS256"
  repeated string types = 3;  // the values of the JWS typ header that the purpose signs
  Kid kid = 4;                // how its kid is made
  RingInfo ring = 5;          // its ring; absent for a purpose without one
}

// RingInfo is the ring of a purpose, as the host declared it (record 0024).
message RingInfo {
  repeated string slots = 1;         // the seal block's signing purposes that hold the purpose's keys on this node, in order
  string current = 2;                // the slot whose key is to sign
  int64 lead_seconds = 3;            // a new key is in the key set this long before it signs
  int64 retain_seconds = 4;          // a key that stopped signing stays in the key set this long
  int64 cache_max_age_seconds = 5;   // the longest cache of the published key set, which the lead is at least
  int64 token_lifetime_seconds = 6;  // the longest life of a token of the purpose with the skew, which the retention is at least
  int64 bootstrap_seconds = 7;       // a node's first key signs at once while every key joined less than this ago; 0: never
  int64 overlap_seconds = 8;         // a node's earlier active key still signs this long after a newer one became active
  bool at_once = 9;                  // a new key signs at once when this node holds no other active key (a restart rotation)
  bool confirm = 10;                 // a key becomes active only after the host confirmed it published
  string node = 11;                  // the node of this instance, as the host named it
}

// SignRequest asks for a compact JWS of the claims.
message SignRequest {
  string purpose = 1;       // a purpose of the host's declaration
  string typ = 2;           // the typ header: one of the purpose's types
  bytes claims_json = 3;    // the payload: one strict JSON object, signed as these bytes; at most 64 KiB
  bytes authorization = 4;  // opaque to the block: handed to the host's rules, and to the seal block's
}

// SignResponse carries the token.
message SignResponse {
  string token = 1;      // the compact JWS: base64url(header) "." base64url(claims_json) "." base64url(signature)
  string kid = 2;        // the kid of its header
  string algorithm = 3;  // the alg of its header
  string key_id = 4;     // the key port's key_id of the key that signed
}

// HostKey is a public key that the host hands in: a key of its own lifecycle (the previous key of a purpose after a rotation, a next key
// published before it signs). The block publishes it and verifies with it; it never signs with it.
message HostKey {
  string kid = 1;            // its kid: 1 to 512 printable ASCII characters, unique in the key set
  string algorithm = 2;      // "ES384" (P-384), "ES256" (P-256) or "RS256" (RSA, 2048 bits or more)
  bytes spki_der = 3;        // the public key, SubjectPublicKeyInfo in DER
  repeated bytes x5c = 4;    // its certificate chain, DER, leaf first; none for no chain
}

// CertificateChain is the certificate chain of a purpose's current key, which the host holds (sluis: the certificate of its CA).
message CertificateChain {
  repeated bytes x5c = 1;  // DER, leaf first
}

// KeySetRequest asks for the key set.
message KeySetRequest {
  repeated string purposes = 1;                   // the purposes whose current key is published, in this order; none: every purpose of the declaration
  repeated HostKey keys = 2;                      // the host's keys, published after the current keys, in this order
  map<string, CertificateChain> chains = 3;       // the x5c of a purpose's current key (for a ring, the key this node signs with), by purpose
  map<string, CertificateChain> key_chains = 4;   // the x5c of a ring key, by kid; a kid that is not in the set is refused
}

// KeySetResponse carries the key set.
message KeySetResponse {
  bytes jwks_json = 1;           // the JWK Set (RFC 7517, section 5) as JSON: kty, the key's members, kid, alg, use "sig", and x5c when given
  repeated PublishedKey keys = 2; // the same keys, in the same order
}

// PublishedKey is one key of the set.
message PublishedKey {
  string kid = 1;        // its kid
  string algorithm = 2;  // its algorithm
  bytes spki_der = 3;    // the public key, SubjectPublicKeyInfo in DER
  string purpose = 4;    // the purpose whose current key it is; empty for a host's key
  string key_id = 5;     // the key port's key_id of a current key; empty for a host's key
  KeyState state = 6;    // the state of a ring key; KEY_STATE_UNSPECIFIED for a key of no ring
  string node = 7;       // the node of a ring key
}

// KeyState is the state of a key of a ring (record 0024). A key moves one way, through pre-published, active, retiring and dropped;
// revoked is reachable from any state and is terminal.
enum KeyState {
  KEY_STATE_UNSPECIFIED = 0;  // not a key of a ring
  KEY_STATE_PRE_PUBLISHED = 1; // in the key set, does not sign yet
  KEY_STATE_ACTIVE = 2;        // in the key set, signs on its own node
  KEY_STATE_RETIRING = 3;      // in the key set until every token it signed has expired, signs no more
  KEY_STATE_DROPPED = 4;       // a tombstone: its kid and times, no key, so that it never joins again
  KEY_STATE_REVOKED = 5;       // revoked by the host: in no key set, never signs, never joins again
}

// RingKey is one key of a ring.
message RingKey {
  string kid = 1;                 // its kid, by the purpose's kid rule
  string key_id = 2;              // the key port's key_id
  string algorithm = 3;           // its algorithm
  bytes spki_der = 4;             // the public key, SubjectPublicKeyInfo in DER; none for a dropped or revoked key
  string node = 5;                // the node that holds it
  string slot = 6;                // the slot it was found in
  KeyState state = 7;             // its state
  int64 added_unix_ms = 8;        // when it joined the ring, milliseconds since the epoch
  int64 state_since_unix_ms = 9;  // when it entered its state
  int64 confirmed_unix_ms = 10;   // when the host confirmed it published; 0: not confirmed
}

// RingState is a ring as the block keeps it in its item of the store port. Its readers call the block; the format is the block's.
message RingState {
  repeated RingKey keys = 1;  // in the order they joined
}

// PurposeRing is the ring of one purpose.
message PurposeRing {
  string purpose = 1;          // the purpose
  repeated RingKey keys = 2;   // its keys, in the order they joined
  string signing_kid = 3;      // the kid this instance signs with now; empty when it has none
}

// RingRequest asks for rings.
message RingRequest {
  repeated string purposes = 1;  // ring purposes; none: every ring purpose of the declaration
}

// RingResponse carries the rings.
message RingResponse {
  repeated PurposeRing rings = 1;  // in the order of the purposes
}

// ReconcileRequest asks the block to apply the ring's rules now.
message ReconcileRequest {
  repeated string purposes = 1;  // ring purposes; none: every ring purpose of the declaration
}

// RingChange is one change that a reconcile made.
message RingChange {
  string purpose = 1;    // the purpose
  string kid = 2;        // the key
  string change = 3;     // "joined", "activated", "retired", "dropped", "forgotten", "revoked" or "confirmed"
  KeyState state = 4;    // the state the key is in after it
  string reason = 5;     // "shortcut" when the key skipped its lead; empty otherwise
}

// ReconcileResponse carries the rings after the reconcile and what changed.
message ReconcileResponse {
  repeated PurposeRing rings = 1;     // in the order of the purposes
  repeated RingChange changes = 2;    // what this call changed; none when the rings were in line
}

// RevokeRequest revokes a kid of a ring purpose.
message RevokeRequest {
  string purpose = 1;  // a ring purpose
  string kid = 2;      // the kid; one the ring does not hold yet is recorded too, so that the key never joins
}

// RevokeResponse says what changed.
message RevokeResponse {
  bool changed = 1;  // false when the kid was revoked already
}

// ConfirmPublishedRequest is the host's statement that every published copy of the key set has these kids since a time.
message ConfirmPublishedRequest {
  string purpose = 1;          // a ring purpose
  repeated string kids = 2;    // kids of the ring; a kid it does not hold, or one that is not pre-published, changes nothing
  int64 at_unix_ms = 3;        // since when, milliseconds since the epoch; 0: now; not after now
}

// ConfirmPublishedResponse says which kids it confirmed.
message ConfirmPublishedResponse {
  repeated string confirmed = 1;  // the kids whose first confirmation this was
}

// VerifyRequest asks whether a token is signed by a key of the set.
message VerifyRequest {
  string token = 1;              // a compact JWS, at most 96 KiB
  repeated string purposes = 2;  // the purposes whose current key may have signed it; none: every purpose of the declaration
  repeated HostKey keys = 3;     // the host's keys that may have signed it as well
  repeated string types = 4;     // the typ values the caller accepts; none: any type of the purpose that signed (a host's key: any)
}

// VerifyResponse names the key that signed and gives the claims. The block checks the signature and the header, never the claims: exp,
// iss, aud and the rest are the host's.
message VerifyResponse {
  string kid = 1;           // the kid of the key that signed
  string algorithm = 2;     // its algorithm
  string typ = 3;           // the typ header
  string purpose = 4;       // the purpose whose current key signed; empty for a host's key
  bytes claims_json = 5;    // the payload as it was signed
}
